<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz - Questions</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header hidden">
            <div class="header-content">
                <h1>English Quiz</h1>
                <div class="quiz-info">
                    <span id="currentTeamDisplay">Team 1</span>
                    <span id="timerDisplay">30s</span>
                </div>
                <button id="resetQuiz" class="btn btn-danger">Reset Quiz</button>
            </div>
        </header>
        
        <main>
            <section id="setupSection" class="setup-section">
                <div class="card">
                    <h2>Quiz Setup</h2>
                    <div class="setup-status">
                        <p>Waiting for quiz to be activated from index.html...</p>
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </section>
            
            <section id="categorySection" class="category-section hidden">
                <div class="category-layout">
                    <div class="category-main">
                        <div class="card">
                            <h2>Select Categories</h2>
                            <div id="categorySelection" class="category-selection">
                                <!-- Categories will be generated here -->
                            </div>
                            <div class="action-buttons">
                                <button id="randomCategoriesBtn" class="btn btn-secondary">Random Categories</button>
                                <button id="startQuizBtn" class="btn btn-primary start-quiz-btn" disabled>Start Quiz</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="category-sidebar">
                        <!-- Leaderboard Section -->
                        <div id="leaderboardSection" class="leaderboard-section">
                            <div class="card">
                                <h2>🏆 Leaderboard</h2>
                                <div id="leaderboard" class="leaderboard">
                                    <!-- Leaderboard will be generated here -->
                                </div>
                            </div>
                            
                            <!-- Team Categories Display -->
                            <div class="card" id="teamCategoriesSection" style="margin-top: 20px; display: none;">
                                <h3>📋 Team Categories</h3>
                                <div id="teamCategories" class="team-categories">
                                    <!-- Team categories will be displayed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
            <section id="questionSection" class="question-section hidden">
                <div class="card">
                    <div class="question-header">
                        <h2 id="categoryTitle">Category: History</h2>
                        <div class="question-info">
                            <span id="questionNumber">Question 1 of 8</span>
                            <span id="currentTeam">Team 1</span>
                        </div>
                    </div>
                    
                    <div class="question-content">
                        <div id="questionText" class="question-text">
                            <!-- Question will be displayed here -->
                        </div>
                        
                        <div id="optionsContainer" class="options-container">
                            <!-- Options will be generated here -->
                        </div>
                    </div>
                    
                    <div class="timer-section">
                        <div class="timer-display" id="timerDisplay">30</div>
                        <div class="timer-bar" id="timerBar">
                            <div class="timer-progress" id="timerProgress"></div>
                        </div>
                    </div>
                    
                    <div class="question-actions">
                        <button id="readyToAnswerBtn" class="btn btn-primary btn-large">Ready to Answer</button>
                        <button id="nextQuestionBtn" class="btn btn-secondary hidden">Next Question</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Emoji Animation Container -->
    <div id="emojiContainer" class="emoji-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
