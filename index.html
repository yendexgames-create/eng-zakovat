<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz - Team Setup</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header hidden">
            <div class="header-content">
                <h1>English Quiz</h1>
                <button id="resetQuiz" class="btn btn-danger">Reset Quiz</button>
            </div>
        </header>
        
        <main>
            <section id="setupSection" class="setup-section">
                <div class="card">
                    <h2>Team Setup</h2>
                    
                    <div class="input-group">
                        <label for="teamCount">Number of Teams:</label>
                        <input type="number" id="teamCount" min="2" max="10" value="2" class="number-input">
                        <button id="generateInputs" class="btn btn-secondary">Generate Team Inputs</button>
                    </div>

                    <div id="teamInputs" class="team-inputs">
                        <div id="teamInputsContainer">
                            <!-- Team inputs will be generated here -->
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="startQuiz" class="btn btn-primary" disabled>Setup Quiz</button>
                    </div>
                    <div id="setupStatus" class="setup-status hidden">
                        <div class="status-message">
                            <h3>Quiz Setup Complete!</h3>
                            <p>Quiz is activated! Open questions.html on another device to start.</p>
                            <div class="teams-display">
                                <h4>Registered Teams:</h4>
                                <div class="teams-list">
                                    <!-- Teams will be displayed here -->
                                </div>
                            </div>
                            <div class="quiz-status">
                                <p class="status-text">Quiz is ready on other devices!</p>
                                <button id="openQuestionsBtn" class="btn btn-secondary" style="margin-top: 15px;">Open Questions Page</button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="scoringSection" class="scoring-section hidden">
                        <div class="card">
                            <h2>Score This Question</h2>
                            <div id="scoringQuestion" class="scoring-question"></div>
                            <div id="teamScores" class="team-scores">
                                <!-- Team scoring will be generated here -->
                            </div>
                            <div class="scoring-actions">
                                <button id="submitScores" class="btn btn-primary">Submit Scores</button>
                                <button id="skipScoring" class="btn btn-secondary">Skip Scoring</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Leaderboard Section -->
                    <div id="leaderboardSection" class="leaderboard-section hidden">
                        <div class="card">
                            <h2>🏆 Leaderboard</h2>
                            <div id="leaderboard" class="leaderboard">
                                <!-- Leaderboard will be generated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
            <section id="quizSection" class="quiz-section hidden">
                <div class="card">
                    <h2>Quiz Categories</h2>
                    <div id="categorySelection" class="category-selection">
                        <!-- Categories will be generated here -->
                    </div>
                    <div class="action-buttons">
                        <button id="randomCategoriesBtn" class="btn btn-secondary">Random Categories</button>
                        <button id="startQuizBtn" class="btn btn-primary start-quiz-btn" disabled>Start Quiz</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Team Answer Modal -->
    <div id="teamAnswerModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Team Answer</h2>
                <button class="modal-close" id="closeTeamAnswerModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="team-answer-info">
                    <h3>Team: <span id="answeringTeamName"></span></h3>
                    <div id="teamAnswerQuestion" class="team-answer-question">
                        <!-- Question will be displayed here -->
                    </div>
                </div>
                <div class="team-answer-actions">
                    <button id="answerCorrect" class="btn btn-success">Correct</button>
                    <button id="answerIncorrect" class="btn btn-danger">Incorrect</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Emoji Animation Container -->
    <div id="emojiContainer" class="emoji-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
